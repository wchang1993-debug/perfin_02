name: Coleta de indicadores

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 BRT — BCB e Tesouro Direto (macro)
    - cron: "30 0 * * 2-6" # 21:30 BRT de seg a sex — ANBIMA e B3 (mercado)
  workflow_dispatch:
    inputs:
      grupo:
        description: "Grupo a coletar"
        required: true
        default: macro
        type: choice
        options: [macro, mercado, feriados]

permissions:
  contents: read

concurrency:
  group: coleta-${{ github.event.inputs.grupo || github.event.schedule }}
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Aplicativo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Aplicativo/coletores/requirements*.txt
      - run: pip install -r coletores/requirements-dev.txt
      - run: python -m pytest coletores -q
      - name: Coletar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COLETA_ANBIMA_B3_ATIVA: ${{ vars.COLETA_ANBIMA_B3_ATIVA }}
          GRUPO: ${{ github.event.inputs.grupo || (github.event.schedule == '0 12 * * *' && 'macro' || 'mercado') }}
        run: python -m coletores.main "$GRUPO"
